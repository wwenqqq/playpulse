apiVersion: v1
kind: Namespace
metadata:
  name: playpulse
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: playpulse
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: playpulse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{name: mysql, containerPort: 3306}]
          env:
            - {name: MYSQL_DATABASE, value: playpulse}
            - {name: MYSQL_USER, value: playpulse}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: playpulse-secrets, key: DB_PASSWORD}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: playpulse-secrets, key: MYSQL_ROOT_PASSWORD}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 750m, memory: 1Gi}
          volumeMounts:
            - {name: mysql-data, mountPath: /var/lib/mysql}
          readinessProbe:
            exec: {command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"]}
            initialDelaySeconds: 25
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim: {claimName: mysql-data}
---
apiVersion: v1
kind: Service
metadata: {name: mysql, namespace: playpulse}
spec:
  selector: {app: mysql}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: playpulse}
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{name: redis, containerPort: 6379}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: playpulse}
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-service, namespace: playpulse}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app: auth-service}
  template:
    metadata:
      labels: {app: auth-service}
    spec:
      containers:
        - name: auth-service
          image: __IMAGE_REPOSITORY__/playpulse-api:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: APP_ROLE, value: auth}
            - {name: DB_URL, value: "jdbc:mysql://mysql:3306/playpulse?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true"}
            - {name: DB_USERNAME, value: playpulse}
            - {name: REDIS_HOST, value: redis}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: playpulse-secrets, key: DB_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: playpulse-secrets, key: JWT_SECRET}}
          resources:
            requests: {cpu: 150m, memory: 384Mi}
            limits: {cpu: 750m, memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            failureThreshold: 18
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: {name: auth-service, namespace: playpulse}
spec:
  selector: {app: auth-service}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: feedback-service, namespace: playpulse}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app: feedback-service}
  template:
    metadata:
      labels: {app: feedback-service}
    spec:
      containers:
        - name: feedback-service
          image: __IMAGE_REPOSITORY__/playpulse-api:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: APP_ROLE, value: feedback}
            - {name: DB_URL, value: "jdbc:mysql://mysql:3306/playpulse?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true"}
            - {name: DB_USERNAME, value: playpulse}
            - {name: REDIS_HOST, value: redis}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: playpulse-secrets, key: DB_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: playpulse-secrets, key: JWT_SECRET}}
          resources:
            requests: {cpu: 150m, memory: 384Mi}
            limits: {cpu: 750m, memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            failureThreshold: 18
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: {name: feedback-service, namespace: playpulse}
spec:
  selector: {app: feedback-service}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: feedback-service, namespace: playpulse}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: feedback-service}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: interaction-service, namespace: playpulse}
spec:
