apiVersion: v1
kind: Namespace
metadata: {name: playpulse}
---
apiVersion: v1
kind: Secret
metadata: {name: playpulse-secrets, namespace: playpulse}
type: Opaque
stringData: {DB_PASSWORD: change-before-cloud-deploy, JWT_SECRET: replace-with-a-long-random-secret, MYSQL_ROOT_PASSWORD: replace-root-password}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mysql, namespace: playpulse}
spec:
  replicas: 1
  selector: {matchLabels: {app: mysql}}
  template:
    metadata: {labels: {app: mysql}}
    spec:
      containers:
      - name: mysql
        image: mysql:8.4
        env: [{name: MYSQL_DATABASE,value: playpulse},{name: MYSQL_USER,value: playpulse},{name: MYSQL_PASSWORD,valueFrom:{secretKeyRef:{name: playpulse-secrets,key: DB_PASSWORD}}},{name: MYSQL_ROOT_PASSWORD,valueFrom:{secretKeyRef:{name: playpulse-secrets,key: MYSQL_ROOT_PASSWORD}}}]
        ports: [{containerPort: 3306}]
---
apiVersion: v1
kind: Service
metadata: {name: mysql, namespace: playpulse}
spec: {selector: {app: mysql}, ports: [{port: 3306}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: playpulse}
spec: {replicas: 1, selector: {matchLabels: {app: redis}}, template: {metadata: {labels: {app: redis}}, spec: {containers: [{name: redis,image: redis:7-alpine,ports: [{containerPort: 6379}]}]}}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: playpulse}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: playpulse}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
      - name: api
        image: ghcr.io/wwenqqq/playpulse-api:1.0.0
        ports: [{containerPort: 8080}]
        env: [{name: DB_URL,value: jdbc:mysql://mysql:3306/playpulse?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true},{name: DB_USERNAME,value: playpulse},{name: DB_PASSWORD,valueFrom:{secretKeyRef:{name: playpulse-secrets,key: DB_PASSWORD}}},{name: REDIS_HOST,value: redis},{name: JWT_SECRET,valueFrom:{secretKeyRef:{name: playpulse-secrets,key: JWT_SECRET}}}]
        resources: {requests: {cpu: 100m,memory: 384Mi},limits: {cpu: 500m,memory: 768Mi}}
        readinessProbe: {tcpSocket: {port: 8080},initialDelaySeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: playpulse}
spec: {selector: {app: api}, ports: [{port: 8080}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: playpulse}
spec: {scaleTargetRef: {apiVersion: apps/v1,kind: Deployment,name: api},minReplicas: 2,maxReplicas: 5,metrics: [{type: Resource,resource: {name: cpu,target: {type: Utilization,averageUtilization: 65}}}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: playpulse}
spec: {replicas: 2,selector: {matchLabels: {app: frontend}},template: {metadata: {labels: {app: frontend}},spec: {containers: [{name: frontend,image: ghcr.io/wwenqqq/playpulse-frontend:1.0.0,ports: [{containerPort: 80}]}]}}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: playpulse}
spec: {type: LoadBalancer,selector: {app: frontend},ports: [{port: 80,targetPort: 80}]}
