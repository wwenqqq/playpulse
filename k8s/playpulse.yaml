          env:
            - {name: APP_ROLE, value: interaction}
            - {name: DB_URL, value: "jdbc:mysql://mysql:3306/playpulse?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true"}
            - {name: DB_USERNAME, value: playpulse}
            - {name: REDIS_HOST, value: redis}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: playpulse-secrets, key: DB_PASSWORD}}
            - name: JWT_SECRET
