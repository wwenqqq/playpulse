<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPulse</title><style>body{margin:0;background:#090d1b;color:#eef3ff;font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:32px}h1{font-size:42px;margin:0}p{color:#aab7d5}.box,article{background:#131a30;border:1px solid #293759;border-radius:14px;padding:18px;margin:16px 0}input,textarea,select,button{padding:10px;border-radius:8px;border:1px solid #344568;background:#0a1020;color:#fff;margin:4px}textarea{width:95%;min-height:90px}button{background:#7957e8;border:0;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tag{color:#55dcef;font-size:12px}</style><body><main class="wrap"><div class="tag">CLOUD-NATIVE GAME QA & LIVEOPS</div><h1>PlayPulse</h1><p>Turn player feedback into better game releases.</p><section class="box"><h2>Account</h2><input id="u" placeholder="username"><input id="p" type="password" placeholder="password"><button onclick="auth('register')">Register</button><button onclick="auth('login')">Sign in</button><span id="user"></span></section><section class="box"><h2>Submit feedback</h2><input id="title" placeholder="Short title" style="width:90%"><br><textarea id="desc" placeholder="Describe the bug, balance concern or feature idea"></textarea><br><select id="cat"><option>BUG</option><option>BALANCE</option><option>FEATURE</option></select><select id="priority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select><button onclick="submitFeedback()">Publish</button></section><section class="box"><input id="search" placeholder="Search feedback"><select id="sort"><option value="latest">Latest</option><option value="popular">Most voted</option></select><button onclick="load()">Refresh</button><div id="feed"></div></section></main><script>let token=localStorage.token||'';const api=async(p,o={})=>{o.headers={...(o.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(o.body)o.headers['Content-Type']='application/json';let r=await fetch('/api/'+p,o),d=await r.json();if(d.code!==200)throw Error(d.message);return d.data};async function auth(mode){try{let d=await api('auth/'+mode,{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});if(mode==='login'){token=d.token;localStorage.token=token;user.textContent=' Signed in as '+d.username}else alert('Account created. Sign in now.')}catch(e){alert(e.message)}}async function submitFeedback(){if(!token)return alert('Sign in first');try{await api('feedback',{method:'POST',body:JSON.stringify({title:title.value,description:desc.value,category:cat.value,priority:priority.value})});title.value=desc.value='';load()}catch(e){alert(e.message)}}async function vote(id){try{await api('feedback/'+id+'/votes',{method:'POST'});load()}catch(e){alert(e.message)}}async function load(){try{let q=new URLSearchParams({search:search.value,sort:sort.value});let d=await api('feedback?'+q);feed.innerHTML=d.content.map(x=>`<article><b>${x.title}</b> <span class="tag">${x.category} · ${x.status}</span><p>${x.description}</p><button onclick="vote(${x.id})">▲ ${x.voteCount} votes</button> <small>${x.commentCount} comments</small></article>`).join('')||'<p>No feedback yet.</p>'}catch(e){feed.innerHTML='<p>Service unavailable.</p>'}}load()</script></body></html>
