<!doctype html>
<html lang="en" data-page="account">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Manage your player account."><meta name="theme-color" content="#0c1014"><title>Account</title><link rel="stylesheet" href="app.css"></head>
<body>
  <a class="skip" href="#main">Skip to account</a>
  <header class="site-header"><a class="brand" href="index.html" aria-label="Overview"><span>PP</span></a><nav aria-label="Primary"><a href="index.html">Overview</a><a href="board.html">Signal board</a><a href="submit.html">Submit</a><a class="active" href="account.html">Account</a></nav><div class="session"><span id="session-name">Guest session</span><a id="account-link" href="account.html">Sign in</a><button id="signout" class="text-button" hidden type="button">Sign out</button></div></header>
  <main id="main" class="page page-account"><section class="account-copy"><p class="eyebrow">Account</p><h1>Join the release <em>room.</em></h1><p>Sign in to submit feedback, vote and reply.</p><a class="arrow-link" href="board.html">Browse signal board <b>&rarr;</b></a></section><section class="account-panel"><div id="account-signed-in" hidden><p class="eyebrow">Session active</p><h2 id="account-user">Signed in</h2><p>You are ready to participate.</p><p class="eyebrow my-signals-label">My signals</p><div id="my-signals" class="feed" aria-live="polite"></div><button id="account-signout" class="button secondary" type="button">Sign out</button></div><div id="account-forms"><div class="tab-row" role="tablist"><button id="login-tab" class="active" type="button">Sign in</button><button id="register-tab" type="button">Create account</button></div><form id="auth-form" novalidate><div class="field"><label for="auth-username">Username</label><input id="auth-username" required minlength="3" autocomplete="username" placeholder="Your player name"></div><div class="field"><label for="auth-password">Password</label><input id="auth-password" required minlength="4" type="password" autocomplete="current-password" placeholder="Your password"></div><p id="auth-message" class="form-message" aria-live="polite"></p><button id="auth-submit" class="button" type="submit">Sign in</button></form></div></section></main>
  <footer><a href="index.html">Back to overview &rarr;</a></footer><script src="app.js?v=2"></script>
