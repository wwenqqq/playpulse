<!doctype html>
<html lang="en" data-page="account">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Manage your GameShelf account and library."><meta name="theme-color" content="#11100e">
  <title>My library / GameShelf</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="game.css">
</head>
<body>
  <a class="skip" href="#main">Skip to account</a>
  <header class="site-header"><a class="brand" href="index.html" aria-label="GameShelf home"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 16h5l3-7 4 12 3-7h7"/></svg><span>GameShelf</span></a><nav aria-label="Primary"><a href="index.html">Discover</a><a href="board.html">Browse games</a><a href="submit.html">Contribute</a><a class="active" aria-current="page" href="account.html">My library</a></nav><div class="session"><span id="session-name">Guest session</span><a id="account-link" href="account.html">Sign in</a><button id="signout" class="text-button" hidden type="button">Sign out</button></div></header>
  <main id="main" class="page page-account">
    <section class="account-copy"><h1>Keep track of what <em>matters.</em></h1><p>Save games in progress, keep a wish list and collect your own notes in one quiet place.</p><a class="arrow-link" href="board.html">Browse games <b>&rarr;</b></a></section>
    <section class="account-panel">
      <div id="account-signed-in" hidden><p class="eyebrow">Library</p><h2 id="account-user">Your library</h2><div id="my-library" class="library-list" aria-live="polite"></div><p class="eyebrow library-heading">Your reviews</p><div id="my-reviews" class="feed" aria-live="polite"></div><button id="account-signout" class="button secondary" type="button">Sign out</button></div>
      <div id="account-forms">
        <div class="tab-row" role="tablist" aria-label="Account action"><button id="login-tab" class="active" type="button" role="tab" aria-selected="true" aria-controls="auth-form">Sign in</button><button id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="auth-form" tabindex="-1">Create account</button></div>
        <form id="auth-form" role="tabpanel" aria-labelledby="login-tab" novalidate>
          <div class="field"><label for="auth-username">Username</label><input id="auth-username" required minlength="3" autocomplete="username" aria-describedby="auth-message" placeholder="Your player name"></div>
          <div class="field"><label for="auth-password">Password</label><input id="auth-password" required minlength="6" maxlength="20" type="password" autocomplete="current-password" aria-describedby="auth-message" placeholder="6 to 20 characters"></div>
          <p id="auth-message" class="form-message" aria-live="polite"></p><button id="auth-submit" class="button" type="submit">Sign in</button>
        </form>
      </div>
    </section>
  </main>
  <footer><a href="index.html">Back to discovery &rarr;</a></footer><script src="app.js?v=5"></script>
</body>
</html>
