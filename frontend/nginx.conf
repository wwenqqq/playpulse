upstream auth_service { server auth-service:8080; }
upstream feedback_service { server feedback-service:8080; }
upstream interaction_service { server interaction-service:8080; }
server {
  listen 80; root /usr/share/nginx/html;
  location ~ ^/api/feedback/[0-9]+/(votes|comments)$ { proxy_pass http://interaction_service; proxy_set_header Host $host; }
  location /api/auth/ { proxy_pass http://auth_service; proxy_set_header Host $host; }
  location = /api/feedback { proxy_pass http://feedback_service; proxy_set_header Host $host; }
  location /api/feedback/ { proxy_pass http://feedback_service; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
}
