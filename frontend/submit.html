<!doctype html>
<html lang="en" data-page="submit">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Submit player feedback."><meta name="theme-color" content="#0c1014"><title>Submit signal</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="brand.css"></head>
<body>
  <a class="skip" href="#main">Skip to feedback form</a>
  <header class="site-header"><a class="brand" href="index.html" aria-label="PlayPulse overview"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 16h5l3-7 4 12 3-7h7"/></svg></a><nav aria-label="Primary"><a href="index.html">Overview</a><a href="board.html">Signal board</a><a class="active" href="submit.html">Submit</a><a href="account.html">Account</a></nav><div class="session"><span id="session-name">Guest session</span><a id="account-link" href="account.html">Sign in</a><button id="signout" class="text-button" hidden type="button">Sign out</button></div></header>
  <main id="main" class="page page-form"><section class="form-aside"><h1>Put it on the <em>board.</em></h1><div class="field-note"><span>01</span><p>Use a short, specific title.</p></div><div class="field-note"><span>02</span><p>Explain the context.</p></div><div class="field-note"><span>03</span><p>Set impact based on the player experience.</p></div></section><section class="form-panel"><form id="feedback-form" novalidate><div class="field"><label for="title">Short title</label><input id="title" maxlength="120" required placeholder="What should the team notice?"></div><div class="field"><label for="description">Context</label><textarea id="description" maxlength="3000" required placeholder="Where did it happen? What did you expect instead?"></textarea></div><div class="form-row"><div class="field"><label for="category">Signal type</label><select id="category"><option value="BUG">Bug</option><option value="BALANCE">Balance</option><option value="FEATURE">Feature</option></select></div><div class="field"><label for="priority">Impact</label><select id="priority"><option value="LOW">Low</option><option value="MEDIUM" selected>Medium</option><option value="HIGH">High</option><option value="CRITICAL">Critical</option></select></div></div><p id="submit-message" class="form-message" aria-live="polite">Sign in before publishing a signal.</p><button class="button" type="submit">Publish signal</button></form></section></main>
  <footer><a href="board.html">Back to board &rarr;</a></footer><script src="app.js?v=2"></script>
</body></html>
