<!doctype html>
<html lang="en" data-page="submit">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Write a game review on GameShelf."><meta name="theme-color" content="#0c1014"><title>Write review · GameShelf</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="game.css"></head>
<body><a class="skip" href="#main">Skip to review form</a><header class="site-header"><a class="brand" href="index.html" aria-label="GameShelf home"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 16h5l3-7 4 12 3-7h7"/></svg><span>GameShelf</span></a><nav aria-label="Primary"><a href="index.html">Discover</a><a href="board.html">Browse games</a><a class="active" href="submit.html">Write review</a><a href="account.html">My library</a></nav><div class="session"><span id="session-name">Guest session</span><a id="account-link" href="account.html">Sign in</a><button id="signout" class="text-button" hidden type="button">Sign out</button></div></header>
  <main id="main" class="page page-form"><section class="form-aside"><p class="eyebrow">Player note</p><h1>Make your time with it <em>useful.</em></h1><div class="field-note"><span>01</span><p>Name the part that stayed with you.</p></div><div class="field-note"><span>02</span><p>Give readers a little context.</p></div><div class="field-note"><span>03</span><p>Recommend it honestly.</p></div></section><section class="form-panel"><form id="feedback-form" novalidate><div class="field"><label for="game-id">Game</label><select id="game-id" required></select></div><div class="field"><label for="title">Review headline</label><input id="title" maxlength="120" required placeholder="One clear takeaway"></div><div class="field"><label for="description">Your note</label><textarea id="description" maxlength="3000" required placeholder="What worked, what did not, and who might enjoy it?"></textarea></div><div class="field"><label for="category">Review type</label><select id="category"><option value="REVIEW">Review</option><option value="RECOMMEND">Recommend</option><option value="CRITIQUE">Critique</option></select></div><p id="submit-message" class="form-message" aria-live="polite">Sign in before publishing a review.</p><button class="button" type="submit">Publish review</button></form></section></main>
  <footer><a href="board.html">Back to games &rarr;</a></footer><script src="app.js?v=3"></script></body></html>
