<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 任务管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="auth-card">
        <h2>🔐 用户登录</h2>

        <!-- 切换标签 -->
        <div class="tabs">
            <button class="tab active" onclick="showTab('login')">登录</button>
            <button class="tab" onclick="showTab('register')">注册</button>
        </div>

        <!-- 登录表单 -->
        <div id="loginForm" class="form-container">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" required>
            </div>
            <button class="btn btn-primary btn-block" onclick="login()">登录</button>
            <div id="loginMessage" class="message"></div>
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" class="form-container" style="display: none;">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="registerUsername" placeholder="3-50个字符" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="registerPassword" placeholder="6-20个字符" required>
            </div>
            <button class="btn btn-primary btn-block" onclick="register()">注册</button>
            <div id="registerMessage" class="message"></div>
        </div>

        <div class="back-link">
            <a href="index.html">← 返回首页</a>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8080';

    // 切换标签
    function showTab(tab) {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(t => t.classList.remove('active'));

        if (tab === 'login') {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            tabs[0].classList.add('active');
        } else {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            tabs[1].classList.add('active');
        }
    }

    // 注册
    async function register() {
        const username = document.getElementById('registerUsername').value;
        const password = document.getElementById('registerPassword').value;
        const messageEl = document.getElementById('registerMessage');

        if (!username || !password) {
            showMessage(messageEl, '请填写用户名和密码', 'error');
            return;
        }

        if (username.length < 3 || username.length > 50) {
            showMessage(messageEl, '用户名长度应为3-50个字符', 'error');
            return;
        }

        if (password.length < 6 || password.length > 20) {
            showMessage(messageEl, '密码长度应为6-20个字符', 'error');
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (data.code === 200) {
                showMessage(messageEl, '注册成功！请登录', 'success');
                setTimeout(() => showTab('login'), 1500);
            } else {
                showMessage(messageEl, data.message || '注册失败', 'error');
            }
        } catch (error) {
            showMessage(messageEl, '网络错误：' + error.message, 'error');
        }
    }

    // 登录
    async function login() {
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        const messageEl = document.getElementById('loginMessage');

        if (!username || !password) {
            showMessage(messageEl, '请填写用户名和密码', 'error');
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (data.code === 200) {
                // 保存 token 到 localStorage
                localStorage.setItem('token', data.data.token);
                localStorage.setItem('username', data.data.username);

                showMessage(messageEl, '登录成功！正在跳转...', 'success');
                setTimeout(() => {
                    window.location.href = 'tasks.html';
                }, 1000);
            } else {
                showMessage(messageEl, data.message || '登录失败', 'error');
            }
        } catch (error) {
            showMessage(messageEl, '网络错误：' + error.message, 'error');
        }
    }

    // 显示消息
    function showMessage(element, message, type) {
        element.textContent = message;
        element.className = `message ${type}`;
        element.style.display = 'block';
    }
</script>
</body>
</html>
