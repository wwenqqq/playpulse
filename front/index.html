<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理系统 - 演示Demo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="welcome-card">
        <h1>🎯 任务管理系统</h1>
        <p class="subtitle">Task Management System - API Demo</p>

        <div class="info-box">
            <h3>📋 功能特性</h3>
            <ul>
                <li>✅ 用户注册/登录（JWT认证）</li>
                <li>✅ 任务增删改查</li>
                <li>✅ 任务截止时间管理</li>
                <li>✅ Redis 缓存优化</li>
                <li>✅ 登录失败次数限制</li>
                <li>✅ AOP 操作日志记录</li>
            </ul>
        </div>

        <div class="tech-stack">
            <h3>🛠️ 技术栈</h3>
            <div class="badges">
                <span class="badge">Spring Boot 3.2.1</span>
                <span class="badge">Java 21</span>
                <span class="badge">MySQL 8.0</span>
                <span class="badge">Redis 5.0</span>
                <span class="badge">JWT</span>
            </div>
        </div>

        <div class="actions">
            <a href="login.html" class="btn btn-primary">开始使用</a>
            <a href="https://github.com/wwenqqq/taskmanagement" target="_blank" class="btn btn-secondary">查看源码</a>
        </div>

        <div class="api-info">
            <p>📡 后端 API: <code>http://localhost:8080</code></p>
            <p>📖 API 文档: <a href="http://localhost:8080/doc.html" target="_blank">http://localhost:8080/doc.html</a></p>
        </div>
    </div>
</div>
</body>
</html>
