spring:
  application:
    name: gameshelf-api

  # Container deployments override the local MySQL defaults.
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/playpulse?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:playpulse}
    password: ${DB_PASSWORD:playpulse}

  # Only the feedback role updates the schema in multi-service deployments.
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Shared Redis connection.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Always override this demonstration secret in cloud deployments.
jwt:
  secret: ${JWT_SECRET:playpulse-demo-secret-change-before-cloud-deployment-2026}
  expiration: 2592000000

springdoc:
  api-docs:
    enabled: true
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.example.taskmanagement.controller

knife4j:
  enable: true
  setting:
    language: EN

app:
  role: ${APP_ROLE:all}
