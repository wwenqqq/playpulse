spring:
  application:
    name: playpulse-api

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/playpulse?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:playpulse}
    password: ${DB_PASSWORD:playpulse}

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# 服务器端口
server:
  port: ${SERVER_PORT:8080}

# JWT配置
jwt:
  secret: ${JWT_SECRET:playpulse-demo-secret-change-before-cloud-deployment-2026}
  expiration: 2592000000

# Knife4j配置
springdoc:
  api-docs:
    enabled: true
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.example.taskmanagement.controller
knife4j:
  enable: true
  setting:
    language: zh-CN
