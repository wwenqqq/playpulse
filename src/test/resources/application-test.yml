spring:
  datasource:
    url: jdbc:h2:mem:playpulse;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      repositories:
        enabled: false
jwt:
  secret: playpulse-test-secret-must-be-at-least-32-characters
  expiration: 3600000
